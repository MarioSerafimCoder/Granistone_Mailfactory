name: Publicar capa Granistone inglês
on:
  push:
    paths:
      - '.github/workflows/publicar-arte-granistone-ingles-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar imagem original
        run: |
          mkdir -p public/emails
          curl --fail --location --retry 3 'https://videocdn.pollo.ai/web-cdn/pollo/production/cmtu2jlff00jg973uir1g1dd0/image/1794319025296-a2340834-aca7-45fe-97c0-4661b4d6a538.png' --output 'public/emails/granistone-from-brazilian-soil-2026.png'
          file 'public/emails/granistone-from-brazilian-soil-2026.png'
          test $(wc -c < 'public/emails/granistone-from-brazilian-soil-2026.png') -gt 100000
      - name: Commit de imagem
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'public/emails/granistone-from-brazilian-soil-2026.png'
          if ! git diff --cached --quiet; then
            git commit -m "assets: publicar arte em ingles da Granistone"
            git push
          fi
